%YAML:1.0
---
Detector:
  # 灰度二值化阈值（亮度高于此视为发光体）
  BinaryThresh: 90
  MinArea: 30.0          # 最小连通区域面积
  MinFoundFrame: 3       # 连续检测多少帧才确认为目标

  # 灯条筛选参数
  BarMinRatio: 1.5       # 灯条最小长宽比
  BarMaxRatio: 20.0      # 灯条最大长宽比

  # 灯条配对参数
  PairLengthDiff: 0.6    # 两灯条长度差异容忍度
  PairXDiffRatio: 0.8    # 水平偏移/平均长度 最大值

  # 矩形比例参数（核心判据）
  # 实际: 宽5cm, 高4.5cm, 宽高比 ≈ 1.11
  RectRatioTarget: 1.11  # 目标矩形宽高比
  RectRatioTolerance: 0.7 # 宽高比容差（允许 0.41 ~ 1.81）

  # 敌方颜色（"red" 或 "blue"）
  EnemyColor: "blue"

  # 形态学核参数（用于合并二值化色块间隙）
  HKernelW: 30           # 水平膨胀核宽度（增大可合并更远的水平间隙）
  HKernelH: 6            # 水平膨胀核高度
  VKernelW: 15           # 垂直膨胀核宽度
  VKernelH: 15           # 垂直膨胀核高度（增大可合并更远的垂直间隙）
  CloseKernelSize: 5     # 闭运算核大小

  # 偏置值（激光对准目标时的 error 值，补偿相机与激光安装位置差异）
  YawOffset: -166.0
  PitchOffset: 133.0


