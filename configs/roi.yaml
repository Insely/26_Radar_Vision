%YAML:1.0
---
ROI:
  # ============ HSV 色块抓取阈值（从全图定位候选 ROI 区域） ============
  # 红色目标（双区间 H 通道）
  # 区间1: 纯红 (H=0~10)
  RedHLow1: 0
  RedSLow1: 40
  RedVLow1: 80
  RedHHigh1: 10
  RedSHigh1: 255
  RedVHigh1: 255
  # 区间2: 品红/紫红~红 (H=125~180)，覆盖紫色目标
  RedHLow2: 125
  RedSLow2: 40
  RedVLow2: 80
  RedHHigh2: 180
  RedSHigh2: 255
  RedVHigh2: 255

  # 蓝色目标（H=90~160，覆盖青蓝~蓝紫/品红）
  BlueHLow: 90
  BlueSLow: 40
  BlueVLow: 80
  BlueHHigh: 160
  BlueSHigh: 255
  BlueVHigh: 255

  # ============ 候选区域参数 ============
  # 色块最小面积阈值（低于此面积的色块不作为候选）
  MinBlobArea: 100.0
  # 最大候选区域数量（取面积最大的前 N 个）
  MaxCandidates: 5
  # 每个候选区域停留时间（秒），未识别到目标时轮切
  DwellTime: 0.1
  # ROI 扩展系数（padding = max(w,h) * PadRatio）
  PadRatio: 0.8
